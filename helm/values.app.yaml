image:
  repository: ghcr.io/pyatakovvg/sellgar.identity.service
imagePullSecrets:
- name: ghcr-pull
applicationPort: 8080
env:
  AMQP_USERNAME:
    valueFrom:
      secretKeyRef:
        name: rabbitmq-default-user
        key: username
  AMQP_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: rabbitmq-default-user
        key: password
  DATABASE_USERNAME:
    valueFrom:
      secretKeyRef:
        name: identity-database
        key: username
  DATABASE_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: identity-database
        key: password
  LEGACY_PASSWORD_HMAC_SECRET:
    valueFrom:
      secretKeyRef:
        name: identity-auth
        key: password-hmac-secret
  SESSION_SECRET_HASH_KEY:
    valueFrom:
      secretKeyRef:
        name: identity-auth
        key: session-hash-key
  FINGERPRINT_STORAGE_SECRET:
    valueFrom:
      secretKeyRef:
        name: identity-auth
        key: fingerprint-storage-secret
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
volumeMounts:
- name: environment
  mountPath: /app/.env
  subPath: .env
  readOnly: true
- name: temporary-files
  mountPath: /tmp
volumes:
- name: environment
  configMap:
    name: identity-service-env
- name: temporary-files
  emptyDir:
    sizeLimit: 32Mi
probes:
  startup:
    httpGet:
      path: /health
      port: http
    periodSeconds: 2
    failureThreshold: 90
  readiness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
  liveness:
    tcpSocket:
      port: http
    periodSeconds: 10
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
ingress:
  enabled: false
migration:
  enabled: true
  command:
  - node
  args:
  - --env-file=.env
  - node_modules/typeorm/cli.js
  - -d
  - dist/data-source.js
  - migration:run
