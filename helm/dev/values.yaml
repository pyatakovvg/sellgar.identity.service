replicas: 1
configmaps:
- nameOverride: identity-service-env
  enabled: true
  filename: .env
  data: |
    PORT=8080
    DATABASE_HOST=postgresql-rw
    DATABASE_PORT=5432
    DATABASE_DATABASE_NAME=identity_srv
    AMQP_HOSTNAME=rabbitmq
    AMQP_PORT=5672
    AMQP_IDENTITY_SRV_COMMAND_QUEUE=identity_srv_command_queue
    AMQP_IDENTITY_SRV_EXCHANGE=identity_srv_exchange
    AMQP_EVENTS_EXCHANGE=event.exchange
    SESSION_RENEW_REQUIRED_AFTER_MS=300000
    SESSION_RENEW_GRACE_AFTER_MS=30000
    SESSION_EXPIRES_AFTER_MS=86400000
    GUEST_SESSION_IDLE_TIMEOUT_MS=2592000000
